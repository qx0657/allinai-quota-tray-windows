name: Validate Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core regression tests
        run: dotnet run --project Tests/CoreTests.csproj -c Release
      - name: Build native app
        run: dotnet build allinai-quota-tray-windows.csproj -c Release --warnaserror
      - name: Native rendering and Credential Manager smoke tests
        run: dotnet run --project Tests/NativeSmoke.csproj -c Release -- publish/previews
      - name: Publish and verify metadata
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/build.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          ./build.ps1
          $info = (Get-Item ./publish/win-x64/AllinAIQuotaTray.exe).VersionInfo
          $expected = ([xml](Get-Content ./allinai-quota-tray-windows.csproj)).Project.PropertyGroup.Version
          if ($info.ProductVersion.Split('+')[0] -ne $expected) { throw "Unexpected product version: $($info.ProductVersion)" }
          if ($info.FileVersion -ne "$expected.0") { throw "Unexpected file version: $($info.FileVersion)" }
      - name: Published tray process starts
        shell: pwsh
        run: |
          $app = Start-Process ./publish/win-x64/AllinAIQuotaTray.exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw "Tray app exited early: $($app.ExitCode)" }
            $second = Start-Process ./publish/win-x64/AllinAIQuotaTray.exe -PassThru
            if (-not $second.WaitForExit(10000)) { Stop-Process -Id $second.Id; throw "Single-instance guard failed" }
            if ($second.ExitCode -ne 0) { throw "Second instance exited with $($second.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-and-previews
          path: publish/
          if-no-files-found: ignore
